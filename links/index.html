<style>
  :root{
    --navy:#2C3E50; --navy-dk:#1A252F; --navy-dker:#131C24;
    --gold:#C6A667; --gold-lt:#DFC28E; --white:#FFFFFF; --line-lt:rgba(255,255,255,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif; min-height:100vh; color:var(--white);
    background:radial-gradient(ellipse 120% 60% at 30% 0%, rgba(198,166,103,0.14), transparent 60%), linear-gradient(165deg, var(--navy-dk), var(--navy-dker));
    display:flex; align-items:center; justify-content:center; padding:36px 18px;
    -webkit-font-smoothing:antialiased;
  }
  .card{ width:100%; max-width:420px; text-align:center; }
  .logo{ width:170px; margin:0 auto 14px; background:rgba(255,255,255,0.96); padding:14px 18px; border-radius:14px; display:block; }
  .tagline{
    font-family:'IBM Plex Mono', monospace; font-size:0.76rem; letter-spacing:0.1em; text-transform:uppercase;
    color:rgba(255,255,255,0.6); margin-bottom:32px;
  }
  .links{ display:flex; flex-direction:column; gap:12px; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:16px 20px; border-radius:12px; font-weight:600; font-size:0.98rem;
    border:1px solid var(--line-lt); color:var(--white); text-decoration:none; transition:all .2s;
  }
  .btn svg{ width:18px; height:18px; flex-shrink:0; }
  .btn:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,0.35); background:rgba(255,255,255,0.05); }
  .btn.primary{ background:linear-gradient(120deg, var(--gold), var(--gold-lt)); color:var(--navy-dker); border:none; font-weight:700; }
  .btn.primary:hover{ box-shadow:0 10px 26px rgba(198,166,103,0.4); }
  .socials{ display:flex; justify-content:center; gap:20px; margin-top:30px; }
  .socials a{ color:rgba(255,255,255,0.7); transition:color .2s; }
  .socials a:hover{ color:var(--gold-lt); }
  .socials svg{ width:22px; height:22px; }
  footer{ margin-top:34px; font-size:0.74rem; color:rgba(255,255,255,0.4); }
  footer a{ color:rgba(255,255,255,0.55); text-decoration:underline; }
</style>
</head>
